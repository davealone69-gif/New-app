# GitHub Actions — Android CI
#
# NOTE: GitHub App installation tokens are not permitted to write files under
# `.github/workflows/`. To enable CI, copy this file to
# `.github/workflows/android.yml` (via the GitHub web UI, or `git mv` locally)
# or commit it yourself — it is otherwise complete and ready to run.
#
# Once enabled, every push to `main` builds the debug APK and uploads it as the
# `3DoubleD-debug-apk` workflow artifact.

name: Android CI

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 8.7

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: 3DoubleD-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
